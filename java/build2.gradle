task openApiGenerateAll(dependsOn: ['generateOrdersApi', 'generateInvoice', 'generatePaydockClient', 'generateDirectMarketing', 'generateMemberProfileClient', 'generateFraudDetectionClient'])

checkstyleMain {
    config = resources.text.fromArchiveEntry(configurations.checkstyleConfig, "checkstyle.xml")
    source = "src/main/java"
}

checkstyleTest {
    config = resources.text.fromArchiveEntry(configurations.checkstyleConfig, "checkstyle-test.xml")
    source = "src/test/java"
}

checkstyle {
    toolVersion = '10.12.3'
}

checkstyleGenerated.enabled = false

compileGeneratedJava.dependsOn('openApiGenerateAll')
copyGeneratedClasses.dependsOn('compileGeneratedJava')
tasks.jib.dependsOn('copyGeneratedClasses')



